services:
  - type: web
    name: rika-lms-agent
    env: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: PYTHONUTF8
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: LMS_TOKEN
        sync: false
      - key: RIKKEI_USERNAME
        sync: false
      - key: RIKKEI_PASSWORD
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: NOCAPTCHA_API_KEY
        sync: false
